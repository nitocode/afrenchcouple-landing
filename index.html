<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A French Couple — Le jeu qui fait parler les couples</title>
  <meta name="description" content="Des questions à se poser, des duels à se lancer, des prédictions à parier. Sur un seul téléphone, au bar, au resto ou sur le canapé. Bilingue FR/EN." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FBF4E8;
      --ink: #26201A;
      --ink-soft: #5C5348;
      --blue: #3E5C9A;
      --bordeaux: #8C2F39;
      --gold: #E5A63C;
      --coral: #FF6B6B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 0 24px; width: 100%; }
    header { padding: 24px 0; }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 46px; height: 46px; }
    .brand span { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; }
    /* Bascule de langue : deux onglets dans une pastille à contour encre. */
    .lang-switch {
      display: flex;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: 3px 3px 0 var(--ink);
    }
    .lang-switch button {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.03em;
      padding: 8px 16px;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .lang-switch button[aria-pressed="true"] { background: var(--bordeaux); color: #fff; }
    main { flex: 1; display: flex; align-items: center; padding: 32px 0 56px; }
    .hero { display: flex; align-items: center; gap: 48px; flex-wrap: wrap; }
    .hero-text { flex: 1 1 380px; }
    h1 {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 800;
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1.1;
    }
    h1 em { font-style: normal; color: var(--bordeaux); }
    .sub {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink-soft);
      margin: 18px 0 28px;
      line-height: 1.55;
      max-width: 46ch;
    }
    .cta-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .btn {
      display: inline-block;
      font-family: 'Baloo 2', sans-serif;
      font-weight: 800;
      font-size: 18px;
      padding: 15px 26px;
      border-radius: 16px;
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      text-decoration: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .btn-primary { background: var(--bordeaux); color: #fff; }
    .btn-ghost { background: #fff; color: var(--ink); }
    .soon { font-size: 14px; font-weight: 800; color: var(--ink-soft); margin-top: 14px; }
    .soon b { color: var(--ink); }
    .hero-art { flex: 1 1 300px; text-align: center; }
    .hero-art img { width: min(340px, 80vw); height: auto; }
    .badges { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
    .badge {
      font-weight: 800;
      font-size: 13px;
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 7px 14px;
      box-shadow: 3px 3px 0 var(--ink);
    }
    footer { padding: 22px 0 30px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
    footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    footer a { color: var(--bordeaux); }
    @media (max-width: 640px) {
      main { padding-top: 8px; }
      .hero { gap: 16px; }
      .hero-art { order: -1; }
      .hero-art img { width: min(240px, 70vw); }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap header-row">
      <div class="brand">
        <img src="assets/heart-logo.png" alt="A French Couple" />
        <span>A French Couple</span>
      </div>
      <div class="lang-switch" role="group" data-i18n-aria-label="langSwitch">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap hero">
      <div class="hero-text">
        <h1 data-i18n-html="title"></h1>
        <p class="sub" data-i18n="sub"></p>
        <div class="cta-row">
          <a class="btn btn-primary" href="https://play.google.com/store/apps/details?id=com.afrenchcouple.app" data-i18n="ctaStore" id="cta-store"></a>
          <a class="btn btn-ghost" href="https://www.instagram.com/a_french_couple" target="_blank" rel="noopener" data-i18n="ctaInsta"></a>
        </div>
        <p class="soon" data-i18n-html="beta"></p>
        <div class="badges">
          <span class="badge" data-i18n="badge1"></span>
          <span class="badge" data-i18n="badge2"></span>
          <span class="badge" data-i18n="badge3"></span>
          <span class="badge" data-i18n="badge4"></span>
        </div>
      </div>
      <div class="hero-art">
        <img src="assets/mascots-welcome.png" data-i18n-alt="mascotsAlt" alt="" />
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>© 2026 A French Couple</span>
      <span>
        <a href="confidentialite.html" data-i18n="privacy"></a>
        &nbsp;·&nbsp;
        <a href="mailto:contact@afrenchcouple.com">contact@afrenchcouple.com</a>
      </span>
    </div>
  </footer>

  <script>
    // i18n minimal : bascule instantanée sans rechargement, langue initiale
    // déduite du navigateur, choix mémorisé pour les visites suivantes.
    const STRINGS = {
      fr: {
        docTitle: 'A French Couple — Le jeu qui fait parler les couples',
        metaDescription:
          "Des questions à se poser, des duels à se lancer, des prédictions à parier. Sur un seul téléphone, au bar, au resto ou sur le canapé. Bilingue FR/EN.",
        langSwitch: 'Changer de langue',
        title: 'Ce soir, on joue à <em>nous</em>.',
        sub: "Des questions à se poser, des duels à se lancer, des prédictions à parier — sur un seul téléphone, au bar, au resto ou sur le canapé. Le jeu qui fait parler les couples, du premier date au vieux couple.",
        ctaStore: 'Bientôt sur Google Play',
        ctaStoreAlert: 'Bientôt disponible sur Google Play !',
        ctaInsta: 'Suivre @a_french_couple',
        beta: "<b>En bêta privée.</b> L'app arrive sur Android, puis iOS.",
        badge1: 'Bilingue FR / EN',
        badge2: '100 % hors ligne',
        badge3: 'Zéro compte, zéro donnée',
        badge4: 'Achat unique, sans abonnement',
        mascotsAlt: 'Ludo et Caro, les mascottes du jeu, vous saluent',
        privacy: 'Confidentialité',
      },
      en: {
        docTitle: 'A French Couple — The game that gets couples talking',
        metaDescription:
          'Questions to ask each other, duels to settle, predictions to bet on. On a single phone, at the bar, at dinner or on the couch. Bilingual FR/EN.',
        langSwitch: 'Switch language',
        title: "Tonight, let's play <em>us</em>.",
        sub: 'Questions to ask each other, duels to settle, predictions to bet on — on a single phone, at the bar, at dinner or on the couch. The game that gets couples talking, from first date to old flames.',
        ctaStore: 'Coming soon on Google Play',
        ctaStoreAlert: 'Coming soon on Google Play!',
        ctaInsta: 'Follow @a_french_couple',
        beta: '<b>In private beta.</b> Android first, then iOS.',
        badge1: 'Bilingual FR / EN',
        badge2: '100% offline',
        badge3: 'No account, no data',
        badge4: 'One-time purchase, no subscription',
        mascotsAlt: 'Ludo and Caro, the game mascots, waving at you',
        privacy: 'Privacy',
      },
    };

    const SUPPORTED = Object.keys(STRINGS);
    const STORAGE_KEY = 'afc-lang';

    function detectLang() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && SUPPORTED.includes(saved)) return saved;
      const preferred = navigator.languages || [navigator.language || 'en'];
      for (const tag of preferred) {
        const base = String(tag).toLowerCase().split('-')[0];
        if (SUPPORTED.includes(base)) return base;
      }
      return 'en';
    }

    function applyLang(lang) {
      const dict = STRINGS[lang];
      document.documentElement.lang = lang;
      document.title = dict.docTitle;
      document
        .querySelector('meta[name="description"]')
        .setAttribute('content', dict.metaDescription);

      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = dict[el.dataset.i18n];
      });
      document.querySelectorAll('[data-i18n-html]').forEach((el) => {
        el.innerHTML = dict[el.dataset.i18nHtml];
      });
      document.querySelectorAll('[data-i18n-alt]').forEach((el) => {
        el.alt = dict[el.dataset.i18nAlt];
      });
      document.querySelectorAll('[data-i18n-aria-label]').forEach((el) => {
        el.setAttribute('aria-label', dict[el.dataset.i18nAriaLabel]);
      });
      document.querySelectorAll('.lang-switch button').forEach((btn) => {
        btn.setAttribute('aria-pressed', String(btn.dataset.lang === lang));
      });

      document.getElementById('cta-store').onclick = (event) => {
        event.preventDefault();
        alert(dict.ctaStoreAlert);
      };
    }

    document.querySelectorAll('.lang-switch button').forEach((btn) => {
      btn.addEventListener('click', () => {
        localStorage.setItem(STORAGE_KEY, btn.dataset.lang);
        applyLang(btn.dataset.lang);
      });
    });

    applyLang(detectLang());
  </script>
</body>
</html>
